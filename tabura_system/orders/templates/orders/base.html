{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KCD Inventra{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>


:root {
    --bg-color: #043261;
    --sidebar-bg: #fffefe;
    --card-bg: #ffffffd3;
    --text-main: #0f172a;
    --text-muted: #001736;
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --border-color: #e2e8f0;
    --radius: 12px;
}

* {
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    min-height: 100vh;
}

/* SIDEBAR */
.sidebar {
    width: 260px;
    background: var(--sidebar-bg);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    padding: 24px;
    border-right: 1px solid var(--border-color);
    box-shadow: 4px 0 10px rgba(0, 0, 0, 0.02);
    z-index: 100;
}

/* BRAND LOGO */
.sidebar-brand {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 15px;
    height: 75px;
    margin-bottom: 35px;
    padding: 0 5px;
}

.sidebar-brand img {
    width: 65px;
    height: 65px;
    object-fit: contain;
    flex-shrink: 0;
}

.sidebar-brand span {
    font-size: 28px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -1px;
    line-height: 1;
}

/* SIDEBAR NAVIGATION */
.sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-grow: 1;
}

.sidebar-nav a {
    color: var(--text-muted);
    text-decoration: none;
    padding: 12px 16px;
    border-radius: 8px;
    font-weight: 500;
    font-size: 0.95rem;
    transition: all 0.2s ease;
}

.sidebar-nav a:hover {
    background: #aed0f0d7;
    color: var(--text-main);
}

.sidebar-nav a.active {
    background: #eef5ff;
    color: var(--primary);
    font-weight: 600;
}

/* SIDEBAR FOOTER */
.sidebar-footer {
    padding-top: 16px;
    border-top: 1px solid var(--border-color);
}

/* MAIN CONTENT */
.main-content {
    margin-left: 260px;
    flex-grow: 1;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px;
    min-height: 100vh;
    background-color: var(--bg-color);
}

.content-container {
    width: 100%;
    max-width: 1100px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .sidebar {
        width: 220px;
        padding: 18px;
    }

    .main-content {
        margin-left: 220px;
        padding: 20px;
    }

    .sidebar-brand img {
        width: 55px;
        height: 55px;
    }

    .sidebar-brand span {
        font-size: 24px;
    }
}
.sidebar-brand {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 15px;
    height: 75px;
    margin-bottom: 35px;
    padding: 0 5px;
}

.sidebar-brand img {
    width: 65px;
    height: 65px;
    object-fit: contain;
    flex-shrink: 0;
}

.sidebar-brand span {
    font-size: 28px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -1px;
    line-height: 1;
}

.sidebar-brand {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 15px;
    height: 75px;
    margin-bottom: 35px;
    padding: 0 5px;
}

.sidebar-brand img {
    width: 65px;
    height: 65px;
    object-fit: contain;
    flex-shrink: 0;
}

.sidebar-brand span {
    display: inline-block;
    font-size: 28px;
    font-weight: 800;
    color: #0f172a;
    letter-spacing: -1px;
    line-height: 1;
    white-space: nowrap;
}

    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-brand">
    <img src="{% static 'image/kcd_logo.png' %}" alt="KCD Inventra Logo">
    <span>KCD</span>
</div>
        <div class="sidebar-nav">
            <a href="{% url 'product_list' %}">🏠 Storefront</a>
            <a href="{% url 'cart_detail' %}">🛒 View Cart</a>
            <a href="{% url 'order_history' %}">📋 Order History</a>
            <a href="{% url 'dashboard' %}">📊 Dashboard</a>
        </div>
        <div class="sidebar-footer">
            <a href="{% url 'logout' %}" style="color: #fca5a5;">🚪 Logout</a>
        </div>
    </div>

    <div class="main-content">
        <div class="content-container">
            {% block content %}
            {% endblock %}
        </div>
    </div>

</body>
</html>
