<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KCD Inventra{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7fbff;
            --sidebar-bg: #dad1d1;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --border-color: #e2e8f0;
            --radius: 12px;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Layout */
        .sidebar {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            box-shadow: 4px 0 10px rgba(0,0,0,0.02);
            z-index: 100;
        }

        .sidebar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 35px;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .menu-item:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .menu-item.active {
            background: #eff6ff;
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Main Content Area */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 50px 40px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        .content-container {
            width: 100%;
            max-width: 1100px;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

    <!-- Persistent Left Sidebar Navigation -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            📦 KCD Inventra
        </div>
        
        <div class="sidebar-menu">
            <a href="{% url 'product_list' %}" class="menu-item {% if request.resolver_match.url_name == 'product_list' %}active{% endif %}">
                🏠 Storefront
            </a>
            <a href="{% url 'cart_detail' %}" class="menu-item {% if request.resolver_match.url_name == 'cart_detail' %}active{% endif %}">
                🛒 View Cart
            </a>
            {% if user.is_authenticated %}
                <a href="{% url 'order_history' %}" class="menu-item {% if request.resolver_match.url_name == 'order_history' %}active{% endif %}">
                    📦 Order History
                </a>
            {% endif %}
        </div>

        <div class="sidebar-footer">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="menu-item {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
                    ⚙️ Dashboard
                </a>
                <a href="{% url 'logout' %}" class="menu-item" style="color: #dc2626;">
                    🚪 Logout
                </a>
            {% else %}
                <a href="{% url 'login' %}" class="menu-item" style="color: var(--primary);">
                    🔐 Login
                </a>
                <a href="{% url 'register' %}" class="menu-item" style="color: #10b981;">
                    📝 Register
                </a>
            {% endif %}
        </div>
    </aside>

    <!-- Main Content Panel -->
    <main class="main-content">
        <div class="content-container">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
